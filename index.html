<body>
  <a class="skip-link" href="#map" data-i18n="skip">Skip to the map</a>
  <header class="topbar">

      <span class="metro-mark" aria-hidden="true">M</span>
      <span><strong>Liam Hellman</strong><small data-i18n="role">Industrial relations · Montréal</small></span>

    <nav class="actions" aria-label="Main navigation">

  <main class="network">
    <section class="map-frame" aria-labelledby="map-heading">
      <div class="map-plaque">
        <p data-i18n="eyebrow">RÉSEAU PERSONNEL · PERSONAL NETWORK</p>
        <h1 id="map-heading"><span data-i18n="name">Liam Hellman</span><small data-i18n="mapTitle">People, work, and the routes between them.</small></h1>
      </div>
      <div class="map-viewport" id="map-viewport" tabindex="0" role="region" aria-label="Interactive Montréal portfolio map; scroll horizontally on small screens">
        <svg id="map" viewBox="0 0 1200 760" role="group" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">Liam Hellman’s Montréal network</title>
          <desc id="svg-desc">An old Montréal metro inspired map with six interactive stations connected by the green, orange, blue, and yellow lines.</desc>
          <defs>
            <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3efdf"/><stop offset="1" stop-color="#ded6bf"/></linearGradient>
            <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8d3cf"/><stop offset="1" stop-color="#8fb8b6"/></linearGradient>
            <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef7"/><stop offset=".65" stop-color="#e8e1cc"/><stop offset="1" stop-color="#b9ae92"/></linearGradient>
            <pattern id="paper-grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#685f4d" opacity=".08"/><circle cx="24" cy="18" r=".5" fill="#685f4d" opacity=".06"/></pattern>
            <filter id="line-depth" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="2.5" flood-color="#433e33" flood-opacity=".34"/></filter>
            <filter id="object-shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#323028" flood-opacity=".28"/></filter>
            <symbol id="person" viewBox="0 0 18 35"><ellipse cx="9" cy="33" rx="7" ry="2" fill="#2c302b" opacity=".2"/><path d="M6 22l-1 9m7-9 1 9" stroke="#263b3c" stroke-width="3.4" stroke-linecap="round"/><path d="M5 13l-3 7m11-7 3 7" stroke="#b87c5e" stroke-width="2.8" stroke-linecap="round"/><rect x="4" y="10" width="10" height="14" rx="3" fill="currentColor"/><circle cx="9" cy="6" r="4.3" fill="#c99771"/><path d="M5 5q2-6 8-1" stroke="#3b322c" stroke-width="2.7" fill="none"/></symbol>
          </defs>

          <rect width="1200" height="760" rx="8" fill="url(#paper)"/>
          <rect width="1200" height="760" rx="8" fill="url(#paper-grain)"/>
          <g id="geography" aria-hidden="true">
            <path d="M0 588Q145 552 281 588T551 627T834 605T1200 555V760H0Z" fill="url(#water)"/>
            <path d="M-10 614Q147 577 291 615T562 654T840 633T1210 583" fill="none" stroke="#e5eeee" stroke-width="3" stroke-dasharray="24 18" opacity=".78"/>
            <path d="M92 442L167 194Q188 124 272 97L667 39Q785 23 886 93L1114 254Q1181 302 1129 381L1015 548Q985 592 917 592L306 596Q223 595 168 545Z" fill="#e7e0ca" stroke="#c9c0a8" stroke-width="2"/>
            <path d="M108 444L180 206Q199 146 276 119L661 63Q770 48 862 110L1095 273Q1144 306 1108 362L1000 526Q974 566 910 566L314 571Q242 569 190 524Z" fill="#ece7d7"/>
            <path d="M176 224q82-137 205-87 50 20 51 103-132 49-256-16Z" fill="#b6bea5" opacity=".72"/>
            <path d="M207 211q59-89 135-55 35 16 42 70-92 37-177-15Z" fill="#9fac91" opacity=".75"/>
            <text x="245" y="191" class="geo-label" data-i18n-svg="mountRoyal">MONT ROYAL</text>
            <path d="M781 543q89-44 186 4l-32 80q-87 28-175-8Z" fill="#e3ddc8" stroke="#bfb69d"/>
            <path d="M705 514l149 117M747 480l153 120" stroke="#aa9f85" stroke-width="4" opacity=".55"/>
            <text x="1010" y="697" class="water-label">FLEUVE SAINT-LAURENT</text>
            <text x="961" y="529" class="geo-label" data-i18n-svg="oldPort">VIEUX-MONTRÉAL</text>
          </g>

          <g class="city-blocks" aria-hidden="true" filter="url(#object-shadow)">
            <g transform="translate(410 476)"><path d="M0 18 36 0l36 18-36 18Z" fill="#d6ccb4"/><path d="M0 18v41l36 18V36Z" fill="#aa9b7e"/><path d="M36 36l36-18v41L36 77Z" fill="#7f8f7e"/></g>
            <g transform="translate(453 446)"><path d="M0 22 44 0l44 22-44 22Z" fill="#c6b99c"/><path d="M0 22v58l44 22V44Z" fill="#9c8c72"/><path d="M44 44l44-22v58l-44 22Z" fill="#60776d"/></g>
            <g transform="translate(505 489)"><path d="M0 17 33 0l33 17-33 17Z" fill="#d8caa9"/><path d="M0 17v43l33 17V34Z" fill="#b59c76"/><path d="M33 34l33-17v43L33 77Z" fill="#7d8c7e"/></g>
            <g transform="translate(900 465)"><path d="M0 20 40 0l40 20-40 20Z" fill="#d8cdb4"/><path d="M0 20v49l40 20V40Z" fill="#9d8e73"/><path d="M40 40l40-20v49l-40 20Z" fill="#70867a"/></g>
          </g>

          <g class="route-shadows" fill="none" stroke="#fff9e8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
            <path d="M590 105C620 173 626 253 645 330S678 423 680 480C665 551 600 609 535 660"/>
            <path d="M205 260C330 241 480 197 590 105C674 74 772 96 845 150"/>
            <path d="M295 650C411 625 535 589 680 480C768 431 866 414 1010 430"/>
            <path d="M680 480C753 520 822 565 900 640"/>
          </g>
          <g class="routes" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#line-depth)">
            <path id="orange-route" d="M590 105C620 173 626 253 645 330S678 423 680 480C665 551 600 609 535 660" stroke="#e86f32"/>
            <path id="blue-route" d="M205 260C330 241 480 197 590 105C674 74 772 96 845 150" stroke="#1677a8"/>
            <path id="green-route" d="M295 650C411 625 535 589 680 480C768 431 866 414 1010 430" stroke="#11815a"/>
            <path id="yellow-route" d="M680 480C753 520 822 565 900 640" stroke="#e4bf22"/>
          </g>

          <g id="minor-stations" aria-hidden="true"></g>
          <g id="trains" aria-hidden="true"></g>
          <g id="station-scenes" aria-hidden="true"></g>
          <g id="walkers" aria-hidden="true"></g>
          <g id="stations"></g>

          <g class="map-key" aria-hidden="true" transform="translate(54 674)">
            <rect width="332" height="48" rx="4" fill="#f8f3e3" stroke="#bdb39b"/>
            <circle cx="25" cy="24" r="10" fill="#20342d"/><text x="25" y="28" text-anchor="middle" class="key-m">M</text>
            <text x="46" y="20" class="key-main">MÉTRO DE MONTRÉAL</text><text x="46" y="34" class="key-sub">CARTE PERSONNELLE · PERSONAL MAP</text>
            <path d="M248 13h67M248 24h67M248 35h67" stroke-width="4"/><path d="M248 13h16" stroke="#11815a" stroke-width="4"/><path d="M265 13h16" stroke="#e86f32" stroke-width="4"/><path d="M282 13h16" stroke="#1677a8" stroke-width="4"/><path d="M299 13h16" stroke="#e4bf22" stroke-width="4"/>
          </g>
          <g class="north" aria-hidden="true" transform="translate(1125 85)"><path d="M0 47V0m-8 13 8-13 8 13" fill="none" stroke="#4f554b" stroke-width="2"/><text x="0" y="-9" text-anchor="middle">N</text></g>
        </svg>
      </div>
      <div class="map-caption">
        <span><i></i><span data-i18n="hint">Select a raised station to explore.</span></span>
        <span data-i18n="caption">Inspired by Montréal’s original métro diagrams · Map not to scale</span>
      </div>
    </section>
  </main>

  <dialog id="story" aria-labelledby="story-title">
