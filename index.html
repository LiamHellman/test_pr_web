<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Liam Hellman's bilingual industrial relations portfolio, mapped through Montréal's métro.">
  <meta name="theme-color" content="#173b33">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Liam Hellman — Montréal connections</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#map-viewport" data-i18n="skip">Skip to the map</a>

  <header class="topbar">
    <a class="identity" href="./" aria-label="Liam Hellman home">
      <span class="metro-mark" aria-hidden="true">M</span>
      <span><strong>Liam Hellman</strong><small data-i18n="role">Industrial relations · Montréal</small></span>
    </a>
    <nav class="actions" aria-label="Main navigation">
      <a id="cv-link" href="assets/Liam-Hellman-CV-EN.pdf" target="_blank" rel="noopener"><span data-i18n="cv">Résumé</span><b aria-hidden="true">↗</b></a>
      <a href="mailto:liamhellman@gmail.com"><span data-i18n="contact">Contact</span><b aria-hidden="true">↗</b></a>
      <button id="language" type="button" aria-label="Passer au français">FR</button>
    </nav>
  </header>

  <main class="network">
    <section class="map-shell" aria-labelledby="map-heading">
      <header class="map-header">
        <div class="map-title">
          <span data-i18n="eyebrow">PERSONAL NETWORK · RÉSEAU PERSONNEL</span>
          <h1 id="map-heading">Liam Hellman</h1>
          <p data-i18n="mapTitle">People, work, and the routes between them.</p>
        </div>
        <div class="line-key" aria-label="Montréal métro lines">
          <span><i class="key-blue"></i><b data-i18n="blueLine">Blue</b></span>
          <span><i class="key-orange"></i><b data-i18n="orangeLine">Orange</b></span>
          <span><i class="key-green"></i><b data-i18n="greenLine">Green</b></span>
          <span><i class="key-yellow"></i><b data-i18n="yellowLine">Yellow</b></span>
        </div>
      </header>

      <div class="map-viewport" id="map-viewport" tabindex="0" role="region" aria-label="Interactive Montréal portfolio map; scroll horizontally on small screens">
        <svg id="metro-map" viewBox="0 0 1200 700" role="group" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">Liam Hellman’s Montréal network</title>
          <desc id="svg-desc">A clean retro Montréal métro map with six interactive portfolio stations, real landmarks, moving trains, and purposeful pedestrian routes.</desc>
          <defs>
            <symbol id="person" viewBox="0 0 16 31">
              <circle cx="8" cy="5" r="4" class="person-skin"/>
              <path d="M5 12h6v9H5Z" fill="currentColor"/>
              <path d="M5 21 3 29M11 21l2 8M5 13l-4 7M11 13l4 7" class="person-limbs"/>
            </symbol>
          </defs>

          <rect class="map-paper" width="1200" height="700"/>
          <g class="geography" aria-hidden="true">
            <path class="river" d="M0 583Q156 552 315 589T627 616T925 587T1200 548V700H0Z"/>
            <path class="river-mark" d="M0 612Q157 579 318 616T629 643T928 614T1200 574"/>
            <path class="island" d="M57 516 133 235Q150 173 225 136L716 70Q805 59 881 111L1100 275Q1145 309 1116 357L1016 517Q988 558 920 559L302 567Q207 568 145 542Z"/>
            <path class="island-inner" d="M86 503 157 250Q174 195 239 164L713 99Q795 88 864 136L1070 290Q1103 314 1082 348L990 491Q968 527 910 529L311 537Q225 537 173 515Z"/>
            <path class="river-island" d="M760 526Q818 494 889 517L928 577Q874 607 799 585Z"/>
            <g class="mount-royal">
              <path d="M140 246Q213 119 348 149 416 164 439 233 320 282 140 246Z"/>
              <path d="M184 231Q239 157 326 172 371 180 389 218 296 250 184 231Z"/>
              <text x="270" y="155" data-i18n-svg="mountRoyal">MONT ROYAL</text>
            </g>
            <g class="downtown-grid">
              <path d="M338 409 579 637M382 376 624 606M425 344 669 574M466 314 713 543"/>
              <path d="M310 516 597 319M348 559 640 356M402 589 682 398"/>
            </g>
            <text class="district-label" x="500" y="675" data-i18n-svg="oldMontreal">OLD MONTRÉAL</text>
            <text class="river-label" x="820" y="680">FLEUVE SAINT-LAURENT</text>
          </g>

          <g class="route-casings" aria-hidden="true">
            <path d="M180 260H260L360 215 520 170H730"/>
            <path d="M520 170 548 215 580 275 610 340 650 430 605 480 535 530 450 565"/>
            <path d="M190 540 360 530 500 500 575 465 650 430H790L960 430"/>
            <path d="M650 430 735 500 830 570 1020 640"/>
          </g>
          <g class="routes" aria-hidden="true">
            <path id="blue-route" class="route-blue" d="M180 260H260L360 215 520 170H730"/>
            <path id="orange-route" class="route-orange" d="M520 170 548 215 580 275 610 340 650 430 605 480 535 530 450 565"/>
            <path id="green-route" class="route-green" d="M190 540 360 530 500 500 575 465 650 430H790L960 430"/>
            <path id="yellow-route" class="route-yellow" d="M650 430 735 500 830 570 1020 640"/>
          </g>

          <g id="trains" aria-hidden="true"></g>
          <g id="minor-stations" aria-hidden="true"></g>

          <g id="access-links" aria-hidden="true">
            <path id="walk-udem" class="access-path access-blue" d="M260 260 224 225 194 207"/>
            <path id="walk-rosemont" class="access-path access-orange" d="M580 275 675 248 783 226"/>
            <path id="walk-berri" class="access-path access-green" d="M650 430 640 370 700 352"/>
            <path id="walk-pda" class="access-path access-green" d="M500 500 500 438 448 409"/>
            <path id="walk-square" class="access-path access-orange" d="M450 565 397 606 355 625"/>
            <path id="walk-drapeau" class="access-path access-yellow" d="M830 570 905 535 990 515"/>
          </g>

          <g id="walkers" aria-hidden="true"></g>
          <g id="landmarks"></g>
          <g id="feature-stations"></g>

          <g class="north" aria-hidden="true" transform="translate(1110 110)">
            <text x="0" y="-15" text-anchor="middle">N</text>
            <path d="M0 43V0m-8 13L0 0l8 13"/>
          </g>
        </svg>
      </div>

      <footer class="map-footer">
        <span><i aria-hidden="true"></i><span data-i18n="hint">Choose a featured station or landmark.</span></span>
        <span data-i18n="caption">A personal diagram inspired by Montréal · Not to scale</span>
      </footer>
    </section>
  </main>

  <dialog id="story" aria-labelledby="story-title">
    <div class="story-head"><span id="story-line"></span><button id="close-story" type="button" aria-label="Close">×</button></div>
    <div id="story-content"></div>
    <div class="story-nav"><button id="previous" type="button" data-i18n="previous">← Previous</button><button id="next" type="button" data-i18n="next">Next station →</button></div>
  </dialog>

  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">Liam Hellman — Industrial relations student at Université de Montréal. <a href="assets/Liam-Hellman-CV-EN.pdf">English résumé</a> · <a href="assets/Liam-Hellman-CV-FR.pdf">CV français</a>.</div></noscript>
</body>
</html>
